version: '3.9'  # Docker Compose version

services:
  api:
    image: restaurant-manager-api:latest
    container_name: restaurant-manager-api
    ports:
      - "${API_PORT}:8080"  # Map host port to container port
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__PostgresConnection=Server=db;Database=${POSTGRES_DB};Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ServerSecretKey=${JWT_SERVER_SECRET_KEY}
      - JwtSettings__AccessTokenLifetime=${JWT_ACCESS_TOKEN_LIFETIME}
      - SessionSettings__RefreshTokenLength=${SESSION_REFRESH_TOKEN_LENGTH}
      - SessionSettings__ServerSecretKey=${SESSION_SERVER_SECRET_KEY}
      - SessionSettings__SessionLifetime=${SESSION_LIFETIME}
      - SessionSettings__RetentionDays=${SESSION_RETENTION_DAYS}
      - Logging__LogLevel__Default=${LOGGING_LOG_LEVEL_DEFAULT}
      - Logging__LogLevel__Microsoft.AspNetCore=${LOGGING_LOG_LEVEL_MICROSOFT_ASPNETCORE}
      - ASPNETCORE_ALLOWEDHOSTS=${ASPNETCORE_ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy # Ensure DB is ready
      migrator:
        condition: service_completed_successfully # Wait for successful migration
    networks:
      - restaurant-network

  migrator:
    image: restaurant-manager-api:latest
    container_name: restaurant-manager-migrator
    restart: "no"
    # profiles: ["migrate"] # Allows manual migration control
    environment:
      - ASPNETCORE_URLS=http://+:8080
      # In order to run the app as a migrator the env must be `Migration`
      - ASPNETCORE_ENVIRONMENT=Migration
      - ConnectionStrings__PostgresConnection=Server=db;Database=${POSTGRES_DB};Port=5432;User Id=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ServerSecretKey=${JWT_SERVER_SECRET_KEY}
      - JwtSettings__AccessTokenLifetime=${JWT_ACCESS_TOKEN_LIFETIME}
      - SessionSettings__RefreshTokenLength=${SESSION_REFRESH_TOKEN_LENGTH}
      - SessionSettings__ServerSecretKey=${SESSION_SERVER_SECRET_KEY}
      - SessionSettings__SessionLifetime=${SESSION_LIFETIME}
      - SessionSettings__RetentionDays=${SESSION_RETENTION_DAYS}
      - Logging__LogLevel__Default=${LOGGING_LOG_LEVEL_DEFAULT}
      - Logging__LogLevel__Microsoft.AspNetCore=${LOGGING_LOG_LEVEL_MICROSOFT_ASPNETCORE}
      - ASPNETCORE_ALLOWEDHOSTS=${ASPNETCORE_ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy # Ensure DB is ready
    networks:
      - restaurant-network

  db:
    image: postgres:18
    container_name: restaurant-manager-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - restaurant-network

networks:
  restaurant-network:

volumes:
  db_data:
